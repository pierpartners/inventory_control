name: 'elevato'
version: '1.0.0'
config-version: 2
profile: 'elevato'

model-paths: ["models"]
target-path: "target"
clean-targets: ["target", "dbt_packages"]

models:
  elevato:
    staging:
      +materialized: view
    intermediate:
      +materialized: table
    marts:
      +materialized: table

vars:
  # qual extrato alimenta o staging: `sintetica` (CSVs de simulacao em
  # data/fonte), `exports` (exportacao do DW em dbt-elevato/exports) ou
  # `real` (extrato do ERP em data/fonte_verdadeira). O
  # carregador do pipeline detecta a pasta presente e passa a var.
  base: sintetica
