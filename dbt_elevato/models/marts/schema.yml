version: 2

models:
  - name: mart_sku_financeiro
    description: Um registro por item com o resultado financeiro do periodo.
    columns:
      - name: sku
        tests: [unique, not_null]
  - name: int_prazo_recebimento_sku
    description: >
      Dias da venda ao caixa por item e canal (mediana dos titulos dos pedidos
      em que o item apareceu) e a contagem de titulos que a sustenta.
    columns:
      - name: sku
        tests: [unique]
  - name: mart_sku_disponibilidade
    description: Dias utilizaveis, dias sem estoque e rupturas parciais por item.
    columns:
      - name: sku
        tests: [unique, not_null]
      - name: dias_utilizaveis
        tests: [not_null]
  - name: mart_demanda_estatistica
    description: Estimativa ingenua x estimativa sobre dias utilizaveis.
    columns:
      - name: sku
        tests: [unique, not_null]
  - name: mart_estoque_diario
    description: Grade item x dia com posicao e estado do estoque.
  - name: mart_vendas_diarias
    description: Serie diaria consolidada da operacao.
    columns:
      - name: data
        tests: [unique, not_null]
  - name: mart_estoque_posicao
    description: >
      Foto do estoque de hoje por item para o diagnostico: saldo no CD e na
      rede, custo medio contabil, ultima venda, ultima entrada e idade FIFO do
      saldo (aproximacao pelas ultimas entradas).
    columns:
      - name: sku
        tests: [unique, not_null]
      - name: saldo_cd
        tests: [not_null]
      - name: data_posicao
        tests: [not_null]
