version: 2

sources:
  - name: raw
    description: >
      Extrato bruto do ERP. Na simulacao vem dos CSVs em data/fonte;
      em producao aponte para as tabelas reais do BigQuery.
    schema: "{{ env_var('RAW_SCHEMA', 'main') }}"
    tables:
      - name: raw_catalogo
        description: Cadastro de itens.
        columns:
          - name: sku
            tests: [unique, not_null]
      - name: raw_vendas
        description: Uma linha por item dentro de cada pedido de venda.
        columns:
          - name: id_linha
            tests: [unique, not_null]
          - name: sku
            tests: [not_null]
      - name: raw_estoque_diario
        description: >
          Posicao de estoque por SKU e por dia. E a tabela que permite separar
          "ninguem quis" de "nao tinha para vender". Sem ela o modelo nao funciona.

      # ---- extrato real do ERP da Elevato (var base=real) ----
      # Cinco tabelas, tres anos. Nao seguem o contrato da base sintetica: o
      # catalogo nao tem custo nem prazo, a venda nao tem lucro e o estoque nao
      # tem saldo de abertura. Os modelos de staging fazem essa traducao.
      - name: raw_produtos
        description: Cadastro do ERP - 162 mil itens, hierarquia e fabricante.
      - name: raw_vendas_todas
        description: >
          Linha de venda de TODAS as lojas do grupo, 3 anos. Substitui
          raw_vendas_ecommerce como fonte de demanda: o estoque diario e do CD
          (empresa 26, local 124) e o e-commerce consome so 17% da baixa dele.
      - name: raw_vendas_ecommerce
        description: >
          Venda do e-commerce (empresa 33), tres anos. Traz margem de
          contribuicao com custo alocado, que NAO serve para decidir compra;
          o lucro incremental e reconstruido em stg_vendas.
      - name: raw_estoque_diario_erp
        description: >
          Retrato diario por empresa, local e subproduto. Fonte do custo medio
          e da posicao disponivel (fisico menos reserva).
      - name: raw_compras
        description: Pedidos de compra - origem do lote minimo praticado.
      - name: raw_ciclo_pagamento
        description: >
          Pedido a pagamento, com prazo de entrega combinado e realizado. E a
          unica fonte de prazo REAL e da sua variabilidade, que o modelo antes
          nao tinha como medir. `prazo_titulo_dias` (extracao do DW a partir
          de 2026-09-18) e quantos dias depois da entrada o titulo ao
          fornecedor vence - media das parcelas ponderada pelo valor, via
          db2.contas_pagar pela mesma idplanilha; mediana 33 dias.
      - name: raw_ciclo_recebimento
        description: >
          Um titulo a receber por pedido de venda (db2.contas_receber, origem
          PRE, ligado a gold.vendas por empresa + pedido), tres anos.
          `dias_recebimento` = dias da venda ate o dinheiro entrar: vencimento
          do titulo mais, no cartao de credito, as parcelas mensais seguintes
          (30 x (parcelas - 1) / 2). Extracao do DW a partir de 2026-09-18.
          So existe na base `dw`; int_prazo_recebimento_sku sai vazio sem ela.

      - name: raw_estoque_posicao_lojas
        description: >
          Foto da posicao ATUAL de estoque fora do CD: um registro por
          (empresa, local, SKU) com a ultima linha de db2.estoque_sintetico
          nos 120 dias anteriores a extracao, so para SKUs do universo do CD e
          so com saldo diferente de zero. Exclui o proprio CD (26/124) e o
          transito fiscal do e-commerce (33/185). Nao e serie diaria: alimenta
          o diagnostico do estoque (saldo na rede por SKU). So existe na base
          `dw` (var posicao_lojas=true).

      # ---- exportacao do DW dwanalitico (var base=exports) ----
      # Dois arquivos gerados em dbt-elevato/exports. O diario e a fonte de
      # estoque E de venda (o e-commerce nao vem linha a linha, so agregado por
      # SKU e dia); o de atributos supre o que o diario nao tem: custo, prazo,
      # lote e cadastro.
      - name: raw_diario_sku
        description: >
          1 linha por SKU x dia, 365 dias. Venda do e-commerce (empresa 33) e
          entradas/saidas/saldo do CD Gravatai (empresa 26, local 124).
      - name: raw_atributos_sku
        description: >
          1 linha por SKU: descricao, marca, secao, unidade, custo medio (ultimo
          dia com estoque + mediana), prazo previsto mediano e lote minimo.
        columns:
          - name: sku
            tests: [unique, not_null]
